name: Static repository checks

# This hosted source-integrity gate complements, but does not replace, focused
# Windows Excel evidence or the final exact-source certification.

on:
  pull_request:
    branches:
      - main
      - "release/**"
  push:
    branches:
      - main
      - "release/**"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: static-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-integrity:
    name: Repository integrity
    runs-on: ubuntu-latest

    steps:
      - name: Check out the exact SHA under review
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Exercise positive and degraded checker paths
        id: self-test
        continue-on-error: true
        run: python3 tools/check_repo.py --root . --self-test

      - name: Validate repository integrity
        id: gate
        continue-on-error: true
        run: >-
          python3 tools/check_repo.py
          --root .
          --output test-results/static-checks.json
          --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload machine-readable report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kpr-static-checks-${{ github.run_id }}
          path: test-results/static-checks.json
          if-no-files-found: error
          retention-days: 30

      - name: Enforce checker and gate results
        if: steps.self-test.outcome == 'failure' || steps.gate.outcome == 'failure'
        run: exit 1
